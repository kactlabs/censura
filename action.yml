name: "Censura"
description: "Black++ - The enhanced Python code formatter with additional features."
author: "Łukasz Langa and contributors to Black (forked as Censura)"
inputs:
  options:
    description:
      "Options passed to Censura. Use `censura --help` to see available options. Default:
      '--check --diff'"
    required: false
    default: "--check --diff"
  src:
    description: "Source to run Censura. Default: '.'"
    required: false
    default: "."
  jupyter:
    description:
      "Set this option to true to include Jupyter Notebook files. Default: false"
    required: false
    default: false
  censura_args:
    description: "[DEPRECATED] Censura input arguments."
    required: false
    default: ""
    deprecationMessage:
      "Input `with.censura_args` is deprecated. Use `with.options` and `with.src` instead."
  version:
    description: 'Python Version specifier (PEP440) - e.g. "21.5b1"'
    required: false
    default: ""
  use_pyproject:
    description: Read Censura version specifier from pyproject.toml if `true`.
    required: false
    default: "false"
  summary:
    description: "Whether to add the output to the workflow summary"
    required: false
    default: true
  output-file:
    description: >
      Optional path to write Censura output to a file in addition to stdout. Useful for
      keeping GitHub Actions logs clean when using --diff or --check.
    required: false
    default: ""
branding:
  color: "purple"
  icon: "check-circle"
runs:
  using: composite
  steps:
    - name: censura
      run: |
        # Even when censura fails, do not close the shell
        set +e

        if [ "$RUNNER_OS" == "Windows" ]; then
          runner="python"
        else
          runner="python3"
        fi

        out=$(${runner} $GITHUB_ACTION_PATH/action/main.py)
        exit_code=$?

        # Display the raw output in the step
        echo "${out}"

        if [ "${INPUT_SUMMARY}" == "true" ]; then
          # Display the Markdown output in the job summary
          echo "\`\`\`python" >> $GITHUB_STEP_SUMMARY
          echo "${out}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi

        # Exit with the exit-code returned by Censura
        exit ${exit_code}
      env:
        # TODO: Remove once https://github.com/actions/runner/issues/665 is fixed.
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_SRC: ${{ inputs.src }}
        INPUT_JUPYTER: ${{ inputs.jupyter }}
        INPUT_CENSURA_ARGS: ${{ inputs.censura_args }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_USE_PYPROJECT: ${{ inputs.use_pyproject }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        pythonioencoding: utf-8
      shell: bash
